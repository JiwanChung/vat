# Kubernetes deployment manifest for a microservices application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
    version: v2.8.0
    tier: backend
    environment: production

spec:
  replicas: 5
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        version: v2.8.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: order-service-sa
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: db-migration
          image: ghcr.io/acme/order-migrate:2.8.0
          command: ["./migrate", "--source", "file:///migrations", "--database", "$(DATABASE_URL)"]
          envFrom:
            - secretRef:
                name: order-db-credentials
      containers:
        - name: order-api
          image: ghcr.io/acme/order-service:2.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
            - name: admin
              containerPort: 9091
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-db-credentials
                  key: connection-string
            - name: KAFKA_BROKERS
              value: kafka-0.kafka:9092,kafka-1.kafka:9092,kafka-2.kafka:9092
            - name: CACHE_REDIS_URL
              value: redis-sentinel://redis-sentinel:26379/0
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service.ecommerce.svc:8080
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service.ecommerce.svc:8080
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service.ecommerce.svc:8080
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-keys
                  key: public.pem
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 500Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /startup
              port: admin
            failureThreshold: 30
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          volumeMounts:
            - name: config
              mountPath: /etc/order-service
              readOnly: true
            - name: cache
              mountPath: /var/cache/orders
        - name: envoy-sidecar
          image: envoyproxy/envoy:v1.28.0
          args: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "order-service"]
          ports:
            - name: proxy-http
              containerPort: 8443
            - name: proxy-admin
              containerPort: 15000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: order-service-config
              - secret:
                  name: order-service-secrets
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: order-service
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: order-service

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
  selector:
    app: order-service

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "1000"
