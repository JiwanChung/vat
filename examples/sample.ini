; ===========================================
; PostgreSQL Configuration (postgresql.conf)
; Optimized for: 64GB RAM, 16 vCPU, NVMe SSD
; Workload: Mixed OLTP + analytics queries
; ===========================================

[server]
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3
unix_socket_directories = /var/run/postgresql

[memory]
; ~25% of RAM for shared buffers
shared_buffers = 16GB
; Per-operation memory
work_mem = 256MB
; Maintenance operations (VACUUM, CREATE INDEX)
maintenance_work_mem = 2GB
; Temporary buffers for session-local temp tables
temp_buffers = 64MB
; Total memory limit for all active hash operations
hash_mem_multiplier = 2.0

[disk]
; 75% of RAM - OS will cache the rest
effective_cache_size = 48GB
; Enable huge pages (must configure OS first)
huge_pages = try
; Temporary file limit per query
temp_file_limit = 10GB

[wal]
; Write-Ahead Log settings
wal_level = replica
wal_buffers = 64MB
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
; Synchronous commit for durability
synchronous_commit = on
; Full page writes (required for point-in-time recovery)
full_page_writes = on
wal_compression = zstd

[replication]
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on
; Archive WAL for backup
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'

[query_planner]
; Planner cost estimates (tuned for NVMe SSD)
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200
; Parallel query settings
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4
parallel_tuple_cost = 0.01
parallel_setup_cost = 100

[autovacuum]
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000

[logging]
; Log settings for monitoring
log_destination = stderr
logging_collector = on
log_directory = /var/log/postgresql
log_filename = postgresql-%Y-%m-%d.log
log_rotation_age = 1d
log_rotation_size = 256MB
log_min_duration_statement = 200
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %q%u@%d '

[statistics]
; Track IO and function statistics
track_activities = on
track_counts = on
track_io_timing = on
track_wal_io_timing = on
track_functions = all

[security]
; SSL configuration
ssl = on
ssl_cert_file = /etc/ssl/certs/server.crt
ssl_key_file = /etc/ssl/private/server.key
ssl_ca_file = /etc/ssl/certs/ca.crt
ssl_min_protocol_version = TLSv1.3
password_encryption = scram-sha-256
