# ===========================================
# Tmux Configuration
# Optimized for: development workflow
# Requires: tmux >= 3.3, tpm for plugins
# ===========================================

# --- General Settings ---

# Use 256 colors + true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Start windows/panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Large scrollback buffer
set -g history-limit 50000

# Faster command sequences (reduce escape delay)
set -sg escape-time 0

# Increase repeat timeout
set -g repeat-time 600

# Focus events for vim autoread
set -g focus-events on

# Display messages longer
set -g display-time 2000
set -g display-panes-time 2000

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Aggressive resize (useful for grouped sessions)
setw -g aggressive-resize on

# Automatic window renaming
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S:#I:#W - #{pane_current_command}"

# --- Prefix Key ---

# Change prefix from C-b to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Double-tap C-a to switch to last window
bind-key C-a last-window

# --- Window Management ---

# Split panes with more intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}" -l 15
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# Swap windows left/right
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# --- Pane Navigation (vim-style) ---

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+hjkl without prefix for fast switching
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# --- Pane Resizing ---

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fine-grained resize with Alt
bind -r M-h resize-pane -L 1
bind -r M-j resize-pane -D 1
bind -r M-k resize-pane -U 1
bind -r M-l resize-pane -R 1

# --- Layouts ---

# Quick layout switches
bind -r Space next-layout
bind = select-layout even-horizontal
bind + select-layout even-vertical

# Custom dev layout: editor left, two terminals right
bind D split-window -h -c "#{pane_current_path}" \; \
       split-window -v -c "#{pane_current_path}" \; \
       select-pane -L \; \
       resize-pane -R 40

# --- Copy Mode (vi) ---

setw -g mode-keys vi
set -g status-keys vi

# Enter copy mode with prefix+[
bind [ copy-mode

# Vi-style copy
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# Incremental search in copy mode
bind -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""

# --- Session Management ---

# Session switcher with fzf
bind s display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs tmux switch-client -t"

# Create named session
bind S command-prompt -p "new session:" "new-session -s '%%'"

# Detach other clients
bind M-d detach-client -a

# --- Quick Commands ---

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Toggle synchronize-panes
bind a setw synchronize-panes \; display-message "sync: #{?pane_synchronized,ON,OFF}"

# Open lazygit in popup
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# Open htop in popup
bind t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "btop"

# Quick note taking
bind n display-popup -d "~/notes" -w 60% -h 60% -E "nvim +':cd ~/notes' +'Telescope find_files'"

# Capture pane output to file
bind P command-prompt -p "save to:" "capture-pane -S -32768 ; save-buffer '%%'"

# --- Status Bar ---

set -g status-interval 5
set -g status-position top
set -g status-justify left

# Status bar colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left status: session name
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa] "

# Right status: host, date, time
set -g status-right-length 80
set -g status-right "#[fg=#6c7086]#{?client_prefix,#[fg=#f38ba8]PREFIX ,}#[fg=#a6adc8]#(kubectl config current-context 2>/dev/null || echo 'no-ctx') #[fg=#6c7086]| #[fg=#a6adc8]%Y-%m-%d #[fg=#cdd6f4,bold]%H:%M "

# Window status format
setw -g window-status-format "#[fg=#6c7086] #I:#W#{?window_zoomed_flag,Z,} "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I:#W#{?window_zoomed_flag,Z,} "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message style
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# Copy mode highlight
setw -g mode-style "bg=#45475a,fg=#cdd6f4"

# Clock
setw -g clock-mode-colour "#89b4fa"
setw -g clock-mode-style 24

# --- Plugins (via TPM) ---

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-open'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @yank_selection_mouse 'clipboard'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
