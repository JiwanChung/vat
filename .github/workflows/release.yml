name: Release

# Publishes to crates.io when a version tag (e.g. v0.1.1) is pushed.
# Requires a CARGO_REGISTRY_TOKEN repository secret (a crates.io API token).
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux clipboard dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$TAG cargo=$CRATE_VER"
          if [ "$TAG" != "$CRATE_VER" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CRATE_VER"
            exit 1
          fi

      - name: Test
        run: cargo test --verbose

      - name: Publish
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
